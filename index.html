<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Workout Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
    }

    .header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      padding: 20px;
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
    }

    .header.sticky {
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 15px;
      color: #ff8c00;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ff8c00 0%, #ff6b00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.6);
      margin-top: 5px;
      font-size: 14px;
      font-weight: 500;
    }

    .quick-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(37, 99, 235, 0.05) 100%);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.1);
    }

    .stat-card svg {
      color: #ff8c00;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff8c00 0%, #ff6b00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
      font-weight: 600;
    }

    .section {
      padding: 0 20px 30px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .section h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #fff;
    }

    .workout-card {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(37, 99, 235, 0.1) 100%);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 15px;
      box-shadow: 0 8px 32px rgba(59, 130, 246, 0.15);
      transition: all 0.3s ease;
    }

    .workout-card:active {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.25);
    }

    .workout-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .workout-header h3 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff8c00 0%, #ff6b00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .workout-header p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      margin-top: 5px;
      font-weight: 500;
    }

    .workout-actions {
      display: flex;
      gap: 8px;
    }

    .btn-start {
      width: 100%;
      background: linear-gradient(135deg, #ff6b00 0%, #ff8c00 100%);
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
    }

    .btn-start:active {
      transform: scale(0.98);
      box-shadow: 0 2px 12px rgba(59, 130, 246, 0.5);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b00 0%, #ff8c00 100%);
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
    }

    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: 0 2px 12px rgba(59, 130, 246, 0.5);
    }

    .btn-secondary {
      background: rgba(59, 130, 246, 0.1);
      color: #ff8c00;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 16px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: all 0.3s ease;
    }

    .btn-secondary:active {
      background: rgba(59, 130, 246, 0.2);
    }

    .btn-icon {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ff8c00;
      transition: all 0.2s ease;
    }

    .btn-icon:active {
      background: rgba(59, 130, 246, 0.3);
      transform: scale(0.95);
    }

    .btn-icon.danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .btn-icon.danger:active {
      background: rgba(239, 68, 68, 0.25);
    }

    .btn-text {
      background: none;
      border: none;
      color: #ff8c00;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.5);
    }

    .empty-state p {
      margin-bottom: 20px;
      font-weight: 500;
    }

    .text-muted {
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      font-weight: 500;
    }

    .history-preview {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      display: flex;
      gap: 15px;
      padding: 16px;
      background: rgba(59, 130, 246, 0.1);
      border-radius: 16px;
      border: 1px solid rgba(59, 130, 246, 0.2);
      transition: all 0.2s ease;
    }

    .history-item:active {
      background: rgba(59, 130, 246, 0.15);
    }

    .history-date {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      font-weight: 600;
    }

    .history-name {
      font-weight: 600;
      color: #fff;
    }

    .exercises-list {
      padding: 20px;
    }

    .exercise-card {
      display: flex;
      gap: 15px;
      padding: 16px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .exercise-number {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff6b00 0%, #ff8c00 100%);
      color: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .exercise-details {
      flex: 1;
    }

    .exercise-details h3 {
      font-size: 16px;
      margin-bottom: 6px;
      color: #fff;
      font-weight: 600;
    }

    .exercise-meta {
      display: flex;
      gap: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      flex-wrap: wrap;
    }

    .exercise-meta span {
      background: rgba(59, 130, 246, 0.15);
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 600;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .fixed-bottom {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      box-shadow: 0 10px 40px rgba(59, 130, 246, 0.5);
    }

    .timer-card {
      margin: 20px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(37, 99, 235, 0.15) 100%);
      border: 2px solid rgba(59, 130, 246, 0.4);
      border-radius: 24px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2);
    }

    .timer-display {
      font-size: 64px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff8c00 0%, #ff6b00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .exercises-training {
      padding: 20px;
      padding-bottom: 100px;
    }

    .exercise-training-card {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .exercise-training-header {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }

    .exercise-info {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      margin-top: 5px;
      font-weight: 500;
    }

    .sets-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .set-item {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .set-checkbox {
      flex: 1;
      background: rgba(59, 130, 246, 0.1);
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .set-checkbox.completed {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.25) 0%, rgba(37, 99, 235, 0.2) 100%);
      border-color: #ff6b00;
      color: #ff8c00;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
    }

    .set-checkbox:active {
      transform: scale(0.98);
    }

    .weight-input {
      width: 85px;
      background: rgba(59, 130, 246, 0.1);
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      padding: 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .weight-input:focus {
      outline: none;
      border-color: #ff6b00;
      background: rgba(59, 130, 246, 0.15);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .progress-text {
      color: #ff8c00;
      font-size: 14px;
      font-weight: 600;
    }

    .history-list {
      padding: 20px;
    }

    .session-card {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .session-header h3 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff8c00 0%, #ff6b00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .session-date {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      margin-top: 5px;
      font-weight: 500;
    }

    .session-exercises {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .session-exercise {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      background: rgba(59, 130, 246, 0.08);
      border-radius: 10px;
      font-size: 13px;
      border: 1px solid rgba(59, 130, 246, 0.15);
    }

    .exercise-name {
      font-weight: 600;
      color: #fff;
    }

    .exercise-stats {
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .hidden {
      display: none;
    }

    svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // Simple icon components as SVG strings
    const icons = {

      apple: '<svg viewBox="0 0 24 24"><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"></path><path d="M10 2c1 .5 2 2 2 5"></path></svg>',

    };

    // Quick Add Meal Templates
    const mealTemplates = {
      breakfast: [
        { name: 'Oatmeal + banana + honey', calories: 450 },
        { name: '3 eggs + toast + butter', calories: 400 },
        { name: 'Müsli + milk + banana', calories: 500 },
        { name: 'Pancakes (3) + syrup', calories: 550 },
        { name: 'Yogurt + granola + berries', calories: 350 }
      ],
      morningSnack: [
        { name: 'Protein shake', calories: 250 },
        { name: 'Banana + peanut butter', calories: 300 },
        { name: 'Apple + nuts', calories: 200 },
        { name: 'Greek yogurt', calories: 150 },
        { name: 'Granola bar', calories: 180 }
      ],
      lunch: [
        { name: 'Chicken + rice + veggies', calories: 800 },
        { name: 'Pasta + meat sauce', calories: 750 },
        { name: 'Pizza (2 slices)', calories: 600 },
        { name: 'Burger + fries', calories: 850 },
        { name: 'Tuna sandwich + chips', calories: 650 }
      ],
      afternoonSnack: [
        { name: 'Protein shake', calories: 250 },
        { name: 'Nuts handful', calories: 200 },
        { name: 'Cheese + crackers', calories: 250 },
        { name: 'Fruit smoothie', calories: 280 },
        { name: 'Energy bar', calories: 220 }
      ],
      dinner: [
        { name: 'Steak + potatoes + salad', calories: 900 },
        { name: 'Chicken + pasta + sauce', calories: 850 },
        { name: 'Fish + rice + broccoli', calories: 700 },
        { name: 'Pork chop + mashed potatoes', calories: 800 },
        { name: 'Spaghetti bolognese', calories: 750 }
      ]
    };

    // App State
    let state = {
      workouts: [],
      sessions: [],
      view: 'home',
      editingWorkout: null,
      activeSession: null,
      timer: 0,
      timerRunning: false,
      timerInterval: null,
      restTimerSeconds: 90, // Default rest timer
      restTimerActive: false,
      restTimeRemaining: 0,
      restTimerInterval: null,
      // Nutrition
      nutritionGoal: 2800,
      nutritionToday: {},
      nutritionHistory: {},
      selectedDate: null,
      customTemplates: {
        breakfast: [],
        morningSnack: [],
        lunch: [],
        afternoonSnack: [],
        dinner: []
      },
      // Measurements
      measurements: [] // Array of {date, biceps, chest, waist, thigh, calf}
    };

    // Load data from localStorage
    function loadData() {
      const workoutsData = localStorage.getItem('workouts');
      const sessionsData = localStorage.getItem('sessions');
      if (workoutsData) state.workouts = JSON.parse(workoutsData);
      if (sessionsData) state.sessions = JSON.parse(sessionsData);
      
      // Load nutrition data
      const nutritionGoal = localStorage.getItem('nutritionGoal');
      const nutritionHistory = localStorage.getItem('nutritionHistory');
      if (nutritionGoal) state.nutritionGoal = parseInt(nutritionGoal);
      if (nutritionHistory) state.nutritionHistory = JSON.parse(nutritionHistory);
      
      // Load today's nutrition
      const today = getTodayDate();

    }

      autoBackup();

      state.nutritionGoal = goal;

    function addMeal(mealType, name, calories) {
      if (!state.nutritionToday[mealType]) {
        state.nutritionToday[mealType] = [];
      }
      
      state.nutritionToday[mealType].push({
        name: name,

      let total = 0;
      Object.keys(state.nutritionToday).forEach(mealType => {
        state.nutritionToday[mealType].forEach(meal => {
          total += meal.calories;
        });
      });
      return total;
    }

    function autoBackup() {
      try {
        const data = {
          workouts: state.workouts,
          sessions: state.sessions,
          nutrition: {
            goal: state.nutritionGoal,
            history: state.nutritionHistory,
            customTemplates: state.customTemplates
          },
          measurements: state.measurements,
          exportDate: new Date().toISOString(),
          version: '2.0'
        };
        
        const dataStr = JSON.stringify(data, null, 2);
        localStorage.setItem('workout-auto-backup', dataStr);
      } catch (error) {
        console.log('Auto backup failed:', error);
      }
    }

    function downloadBackup() {
      try {
        const backupData = localStorage.getItem('workout-auto-backup');
        if (!backupData) {
          alert('No backup available yet. Complete a workout first.');
          return;
        }
        
        const dataBlob = new Blob([backupData], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `workout-backup-${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        
        alert('Backup downloaded!');
      } catch (error) {
        alert('Download failed: ' + error.message);
      }
    }

        exercises: workout.exercises.map(ex => ({

    function startRestTimer() {
      state.restTimerActive = true;
      state.restTimeRemaining = state.restTimerSeconds;
      
      if (state.restTimerInterval) {
        clearInterval(state.restTimerInterval);
      }
      
      state.restTimerInterval = setInterval(() => {
        state.restTimeRemaining--;
        
        if (state.restTimeRemaining <= 0) {
          clearInterval(state.restTimerInterval);
          state.restTimerInterval = null;
          state.restTimerActive = false;
          
          // Play beep sound
          playBeep();
          
          render();
        } else {
          render();
        }
      }, 1000);
      
      render();
    }

    function stopRestTimer() {
      if (state.restTimerInterval) {

        state.restTimerInterval = null;
      }
      state.restTimerActive = false;
      state.restTimeRemaining = 0;
      render();
    }

    function playBeep() {
      // Create audio beep using Web Audio API
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 800; // Frequency in Hz
      oscillator.type = 'sine';
      
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
      
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.5);
      
      // Play 3 beeps
      setTimeout(() => {
        const osc2 = audioContext.createOscillator();
        const gain2 = audioContext.createGain();
        osc2.connect(gain2);
        gain2.connect(audioContext.destination);
        osc2.frequency.value = 800;
        osc2.type = 'sine';
        gain2.gain.setValueAtTime(0.3, audioContext.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
        osc2.start(audioContext.currentTime);
        osc2.stop(audioContext.currentTime + 0.5);
      }, 200);
      
      setTimeout(() => {
        const osc3 = audioContext.createOscillator();
        const gain3 = audioContext.createGain();
        osc3.connect(gain3);
        gain3.connect(audioContext.destination);
        osc3.frequency.value = 800;
        osc3.type = 'sine';
        gain3.gain.setValueAtTime(0.3, audioContext.currentTime);
        gain3.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
        osc3.start(audioContext.currentTime);
        osc3.stop(audioContext.currentTime + 0.5);
      }, 400);
    }

    function changeRestTimer() {
      const current = state.restTimerSeconds;
      const newTime = prompt(`Rest timer (seconds):\n\nCurrent: ${current}s\n\nCommon: 60s, 90s, 120s, 180s`, current);
      if (!newTime) return;
      
      const seconds = parseInt(newTime);
      if (isNaN(seconds) || seconds < 10 || seconds > 600) {
        alert('Please enter a time between 10-600 seconds');
        return;
      }
      
      state.restTimerSeconds = seconds;
      localStorage.setItem('restTimerSeconds', seconds.toString());
      render();
    }

    function quickChangeRestTimer() {
      const options = [30, 60, 90, 120, 180];
      const current = state.restTimerSeconds;
      
      let message = 'Quick Change Rest Timer:\n\n';
      options.forEach((sec, idx) => {
        const mins = Math.floor(sec / 60);
        const secs = sec % 60;
        const timeStr = secs > 0 ? `${mins}:${secs.toString().padStart(2, '0')}` : `${mins}:00`;
        const isCurrent = sec === current ? ' ✓' : '';
        message += `${idx + 1}. ${timeStr} (${sec}s)${isCurrent}\n`;
      });
      message += `\n0. Custom time\n\nSelect:`;
      
      const choice = prompt(message);
      if (!choice) return;
      
      const choiceNum = parseInt(choice);
      
      if (choiceNum === 0) {
        // Custom time
        changeRestTimer();
      } else if (choiceNum > 0 && choiceNum <= options.length) {
        state.restTimerSeconds = options[choiceNum - 1];
        localStorage.setItem('restTimerSeconds', state.restTimerSeconds.toString());
        render();
      }
    }

    function adjustRestTimer(delta) {
      const newValue = state.restTimerSeconds + delta;
      
      // Min 30s, Max 300s (5min)
      if (newValue < 30 || newValue > 300) return;
      
      state.restTimerSeconds = newValue;
      localStorage.setItem('restTimerSeconds', state.restTimerSeconds.toString());

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            
            if (!data.workouts || !data.sessions) {
              alert('Invalid backup file!');
              return;
            }
            
            if (confirm('This will replace all current data. Continue?')) {
              saveWorkouts(data.workouts);
              saveSessions(data.sessions);
              
              // Import nutrition data if available
              if (data.nutrition) {
                if (data.nutrition.goal) {
                  saveNutritionGoal(data.nutrition.goal);
                }
                if (data.nutrition.history) {
                  state.nutritionHistory = data.nutrition.history;
                  localStorage.setItem('nutritionHistory', JSON.stringify(data.nutrition.history));
                  
                  // Load today's data
                  const today = getTodayDate();
                  state.nutritionToday = state.nutritionHistory[today] || {
                    breakfast: [],
                    morningSnack: [],
                    lunch: [],
                    afternoonSnack: [],
                    dinner: []
                  };
                }
                if (data.nutrition.customTemplates) {
                  state.customTemplates = data.nutrition.customTemplates;
                  localStorage.setItem('customTemplates', JSON.stringify(data.nutrition.customTemplates));
                }
              }
              
              // Import measurements if available
              if (data.measurements) {
                state.measurements = data.measurements;
                localStorage.setItem('measurements', JSON.stringify(data.measurements));
              }
              
              state.view = 'home';
              render();
              alert('Data restored successfully!');
            }
          } catch (error) {
            alert('Error reading backup file!');
          }
        };
        reader.readAsText(file);
      };
      
      input.click();
    }

    function importCSV() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.csv,text/csv';
      
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const csv = event.target.result;
            const lines = csv.split('\n').filter(line => line.trim());
            
            // Skip header
            const dataLines = lines.slice(1);
            
            const workouts = {};
            let currentType = null;
            
            dataLines.forEach(line => {
              const cols = line.split(',').map(c => c.trim());
              
              // Check if this is a new workout type
              if (cols[2] && cols[2].length > 0) {
                currentType = cols[2].replace('.', '').trim();
                if (!workouts[currentType]) {
                  workouts[currentType] = {
                    id: Date.now() + Math.random(),
                    name: currentType,
                    exercises: []
                  };
                }
              }
              
              // Add exercise if we have a valid row
              if (currentType && cols[4] && cols[4].length > 0) {
                const exercise = {
                  id: Date.now() + Math.random(),
                  name: cols[4],
                  series: parseInt(cols[5]) || 3,
                  reps: parseInt(cols[6]) || 10,
                  weightType: cols[7] || 'bodyweight',
                  weight: parseFloat(cols[8]) || 0,
                  rest: parseFloat(cols[9]) || 1
                };
                workouts[currentType].exercises.push(exercise);
              }
            });
            
            const workoutArray = Object.values(workouts);
            
            if (workoutArray.length === 0) {
              alert('No workouts found in CSV!');
              return;
            }
            
            if (confirm(`Import ${workoutArray.length} workout(s) from CSV? This will add to existing workouts.`)) {
              saveWorkouts([...state.workouts, ...workoutArray]);
              state.view = 'home';
              render();
              alert(`Successfully imported ${workoutArray.length} workout(s)!`);
            }
          } catch (error) {
            alert('Error reading CSV file: ' + error.message);
          }
        };
        reader.readAsText(file);
      };
      
      input.click();
    }

    function duplicateWorkout(workoutId) {
      const workout = state.workouts.find(w => w.id === workoutId);
      if (!workout) return;
      
      const newName = prompt('New workout name:', workout.name + ' Copy');
      if (!newName) return;
      
      const duplicate = {
        id: Date.now(),
        name: newName,
        exercises: workout.exercises.map(ex => ({
          ...ex,
          id: Date.now() + Math.random()
        }))
      };
      
      saveWorkouts([...state.workouts, duplicate]);
      render();
      alert('Workout duplicated!');
    }

    function editExercise(workoutId, exerciseId) {
      const workout = state.workouts.find(w => w.id === workoutId);
      if (!workout) return;
      
      const exercise = workout.exercises.find(ex => ex.id === exerciseId);
      if (!exercise) return;
      
      const name = prompt('Exercise name:', exercise.name);
      if (name === null) return;
      
      const series = parseInt(prompt('Number of sets:', exercise.series));
      if (isNaN(series)) return;
      
      const reps = parseInt(prompt('Number of reps:', exercise.reps));
      if (isNaN(reps)) return;
      
      const weightType = prompt('Weight type (bodyweight/dumbbell/kettlebell/plate/barbell):', exercise.weightType);
      if (weightType === null) return;
      
      let weight = exercise.weight;
      if (weightType !== 'bodyweight') {
        const weightInput = prompt('Weight - Load (kg):', exercise.weight);
        if (weightInput === null) return;
        weight = parseFloat(weightInput) || 0;
      } else {
        weight = 0;
      }
      
      const restInput = prompt('Rest period between sets (minutes):', exercise.rest);
      if (restInput === null) return;
      const rest = parseFloat(restInput) || 1;
      
      const superset = confirm('Part of Superset?');
      
      const updated = state.workouts.map(w => {
        if (w.id === workoutId) {
          return {
            ...w,
            exercises: w.exercises.map(ex => {
              if (ex.id === exerciseId) {
                return { ...ex, name, series, reps, weightType, weight, rest, superset };
              }
              return ex;
            })
          };
        }
        return w;
      });
      
      saveWorkouts(updated);
      render();
    }

    function addMeasurement() {
      // Date
      const today = new Date().toISOString().split('T')[0];
      const dateStr = prompt(`Measurement Date:\n\nFormat: YYYY-MM-DD`, today);
      if (!dateStr) return;
      
      // Validate date
      const date = new Date(dateStr);
      if (isNaN(date.getTime())) {
        alert('Invalid date format!');
        return;
      }
      
      // Weight
      const weight = prompt(`⚖️ Weight (kg):`);
      if (!weight || isNaN(weight)) return;
      
      // Biceps
      const biceps = prompt(`💪 Biceps (cm):`);
      if (!biceps || isNaN(biceps)) return;
      
      // Chest
      const chest = prompt(`🫁 Chest (cm):`);
      if (!chest || isNaN(chest)) return;
      
      // Waist
      const waist = prompt(`📏 Waist (cm):`);
      if (!waist || isNaN(waist)) return;
      
      // Thigh
      const thigh = prompt(`🦵 Thigh (cm):`);
      if (!thigh || isNaN(thigh)) return;
      
      // Calf
      const calf = prompt(`🦿 Calf (cm):`);
      if (!calf || isNaN(calf)) return;
      
      // Create measurement
      const measurement = {
        id: Date.now(),
        date: dateStr,
        weight: parseFloat(weight),
        biceps: parseFloat(biceps),
        chest: parseFloat(chest),
        waist: parseFloat(waist),
        thigh: parseFloat(thigh),
        calf: parseFloat(calf)
      };
      
      // Add to measurements (newest first)
      state.measurements.unshift(measurement);
      
      // Save
      localStorage.setItem('measurements', JSON.stringify(state.measurements));
      autoBackup();
      render();
    }

      state.measurements = state.measurements.filter(m => m.id !== id);
      localStorage.setItem('measurements', JSON.stringify(state.measurements));

    function renderNutritionView() {
      const totalCalories = getTotalCalories();
      const percentComplete = Math.min(100, (totalCalories / state.nutritionGoal) * 100);
      
      const mealSections = [
        { key: 'breakfast', name: 'Breakfast', icon: '🌅' },
        { key: 'morningSnack', name: 'Morning Snack', icon: '☕' },
        { key: 'lunch', name: 'Lunch', icon: '🍗' },
        { key: 'afternoonSnack', name: 'Afternoon Snack', icon: '🍎' },
        { key: 'dinner', name: 'Dinner', icon: '🍝' }
      ];

      return `
        <div class="nutrition-view">
          <div class="header">
            <button class="btn-icon" onclick="goHome()">
              ${icons.x}
            </button>
            <h1>🍽️ Nutrition</h1>
            <button class="btn-icon" onclick="viewNutritionHistory()">
              ${icons.calendar}
            </button>
          </div>

          <div class="section">
            <div class="stat-card" style="flex-direction: column; align-items: stretch; gap: 15px;">
              <div>
                <div style="text-align: center; margin-bottom: 10px;">
                  <div style="font-size: 32px; font-weight: 700; color: #ff6b00;">
                    ${totalCalories} <span style="font-size: 20px; color: rgba(255, 255, 255, 0.5);">/ ${state.nutritionGoal}</span>
                  </div>
                  <div style="color: rgba(255, 255, 255, 0.5); font-size: 14px;">kcal today</div>
                </div>
                <div style="background: rgba(255, 255, 255, 0.1); border-radius: 15px; height: 20px; overflow: hidden;">
                  <div style="background: linear-gradient(90deg, #ff6b00, #ff8c00); height: 100%; width: ${percentComplete}%; transition: width 0.3s; border-radius: 15px;"></div>
                </div>
                <div style="text-align: center; margin-top: 10px; font-size: 14px;">
                  ${totalCalories < state.nutritionGoal 
                    ? `<span style="color: #ff6b00;">💪 ${state.nutritionGoal - totalCalories} kcal to go!</span>`
                    : `<span style="color: #4ade80;">✅ Goal reached!</span>`
                  }
                </div>
              </div>
            </div>
          </div>

          ${mealSections.map(section => {
            const meals = state.nutritionToday[section.key] || [];
            const totalMealCal = meals.reduce((sum, meal) => sum + meal.calories, 0);
            
            return `
              <div class="section">
                <div class="section-header">
                  <h2>${section.icon} ${section.name}</h2>
                  ${totalMealCal > 0 ? `<span style="color: #ff6b00; font-weight: 600;">${totalMealCal} kcal</span>` : ''}
                </div>
                
                ${meals.length === 0 ? `
                  <button class="btn-secondary" onclick="showQuickAdd('${section.key}')" style="width: 100%; margin-bottom: 10px;">
                    ⚡ Quick Add
                  </button>
                  <button class="btn-secondary" onclick="promptAddMeal('${section.key}')" style="width: 100%;">
                    ${icons.plus} Add ${section.name}
                  </button>
                ` : `
                  <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
                    ${meals.map((meal, idx) => `
                      <div class="stat-card" style="flex-direction: row; justify-content: space-between; align-items: center;">
                        <div>
                          <div style="font-weight: 600; color: #fff;">${meal.name}</div>
                          <div style="font-size: 13px; color: rgba(255, 255, 255, 0.5);">${meal.calories} kcal · ${meal.time}</div>
                        </div>
                        <button class="btn-icon danger" onclick="deleteMeal('${section.key}', ${idx})">
                          ${icons.trash2}
                        </button>
                      </div>
                    `).join('')}
                  </div>
                  <button class="btn-secondary" onclick="showQuickAdd('${section.key}')" style="width: 100%; margin-bottom: 10px;">
                    ⚡ Quick Add
                  </button>
                  <button class="btn-secondary" onclick="promptAddMeal('${section.key}')" style="width: 100%;">
                    ${icons.plus} Add more
                  </button>
                `}
              </div>
            `;
          }).join('')}
        </div>
      `;

    function renderNutritionHistoryView() {
      // Get last 7 days of history
      const days = [];
      for (let i = 0; i < 7; i++) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().split('T')[0];
        days.push({
          dateStr,
          date: date,
          data: state.nutritionHistory[dateStr] || null
        });
      }

      return `
        <div class="nutrition-history-view">
          <div class="header">
            <button class="btn-icon" onclick="viewNutrition()">
              ${icons.x}
            </button>
            <h1>📅 History</h1>
            <div style="width: 40px"></div>
          </div>

          <div class="section">
            <h2>Last 7 Days</h2>
            
            ${days.map(day => {
              const isToday = day.dateStr === getTodayDate();
              let totalCals = 0;
              
              if (day.data) {
                Object.keys(day.data).forEach(mealType => {
                  if (Array.isArray(day.data[mealType])) {
                    day.data[mealType].forEach(meal => {
                      totalCals += meal.calories || 0;
                    });
                  }
                });
              }
              
              const percent = Math.min(100, (totalCals / state.nutritionGoal) * 100);
              const dayName = day.date.toLocaleDateString('en-US', { weekday: 'short' });
              const dateDisplay = day.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
              
              return `
                <div class="stat-card" style="margin-bottom: 12px; cursor: ${day.data ? 'pointer' : 'default'};" ${day.data ? `onclick="viewDayDetails('${day.dateStr}')"` : ''}>
                  <div style="flex: 1;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                      <div>
                        <span style="font-weight: 700; color: ${isToday ? '#ff6b00' : '#fff'};">
                          ${isToday ? 'Today' : dayName}
                        </span>
                        <span style="color: rgba(255, 255, 255, 0.5); font-size: 13px; margin-left: 8px;">
                          ${dateDisplay}
                        </span>
                      </div>
                      <div style="font-weight: 600; color: ${totalCals >= state.nutritionGoal ? '#4ade80' : totalCals > 0 ? '#ff6b00' : 'rgba(255,255,255,0.3)'};">
                        ${totalCals > 0 ? `${totalCals} kcal` : 'No data'}
                      </div>
                    </div>
                    ${totalCals > 0 ? `
                      <div style="background: rgba(255, 255, 255, 0.1); border-radius: 10px; height: 8px; overflow: hidden;">
                        <div style="background: linear-gradient(90deg, ${totalCals >= state.nutritionGoal ? '#4ade80' : '#ff6b00'}, ${totalCals >= state.nutritionGoal ? '#22c55e' : '#ff8c00'}); height: 100%; width: ${percent}%; transition: width 0.3s;"></div>
                      </div>
                    ` : ''}
                  </div>
                  ${day.data ? `<div style="color: rgba(255, 255, 255, 0.3); margin-left: 10px;">${icons.chevronRight}</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderDayDetailsView() {
      const dateStr = state.selectedDate;
      const date = new Date(dateStr + 'T12:00:00'); // Avoid timezone issues
      const dayData = state.nutritionHistory[dateStr];
      
      if (!dayData) {
        return `<div class="section"><p>No data for this day</p></div>`;
      }

      let totalCals = 0;
      Object.keys(dayData).forEach(mealType => {
        if (Array.isArray(dayData[mealType])) {
          dayData[mealType].forEach(meal => {
            totalCals += meal.calories || 0;
          });
        }
      });

      const isToday = dateStr === getTodayDate();
      const dayName = date.toLocaleDateString('en-US', { weekday: 'long' });
      const dateDisplay = date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

    function render() {
      const app = document.getElementById('app');
      let content = '';

      switch(state.view) {
        case 'home':
          content = renderHomeView();
          break;
        case 'create':
          content = renderCreateView();
          break;
        case 'train':
          content = renderTrainingView();
          break;
        case 'history':
          content = renderHistoryView();
          break;
        case 'nutrition':
          content = renderNutritionView();
          break;
        case 'nutritionHistory':
          content = renderNutritionHistoryView();
          break;
        case 'dayDetails':
          content = renderDayDetailsView();
          break;
        case 'settings':
          content = renderSettingsView();
          break;
        case 'manageTemplates':
          content = renderManageTemplatesView();
          break;
        case 'measurements':
          content = renderMeasurementsView();
          break;
      }

      app.innerHTML = content;
    }

    // Event handlers
    function createNewWorkout() {
      const name = prompt('Workout name (e.g. A, B, C):');
      if (name) createWorkout(name);
    }

    function editWorkout(id) {
      state.editingWorkout = id;
      state.view = 'create';
      render();
    }

    function confirmDeleteWorkout(id) {
      if (confirm('Really delete this workout?')) {
        deleteWorkout(id);
      }
    }

    function startWorkout(id) {
      const workout = state.workouts.find(w => w.id === id);
      if (workout) startSession(workout);
    }

    function addNewExercise(workoutId) {
      const name = prompt('Exercise name:');
      if (!name) return;
      const series = parseInt(prompt('Number of sets:') || '3');
      const reps = parseInt(prompt('Number of reps:') || '10');
      const weightType = prompt('Weight type (bodyweight/dumbbell/kettlebell/plate/barbell):') || 'bodyweight';
      const weight = weightType === 'bodyweight' ? 0 : parseFloat(prompt('Weight - Load (kg):') || '0');
      const rest = parseFloat(prompt('Rest period between sets (minutes):') || '1');
      const superset = confirm('Part of Superset?');

      addExercise(workoutId, {
        name,
        series,
        reps,
        weightType,
        weight,
        rest,
        superset
      });
    }

    function confirmDeleteExercise(workoutId, exerciseId) {
      if (confirm('Delete this exercise?')) {
        deleteExercise(workoutId, exerciseId);
      }
    }

    function confirmEndWorkout() {
      if (confirm('Really end workout?')) {
        state.activeSession = null;
        state.view = 'home';
        state.timer = 0;
        state.timerRunning = false;
        if (state.timerInterval) {
          clearInterval(state.timerInterval);
          state.timerInterval = null;
        }
        render();
      }
    }

    function goHome() {
      state.view = 'home';
      render();
    }

    function viewHistory() {
      state.view = 'history';
      render();
    }

    function viewNutrition() {
      state.view = 'nutrition';
      render();
    }

    function showQuickAdd(mealType) {
      const presetTemplates = mealTemplates[mealType] || [];
      const customTemplates = state.customTemplates[mealType] || [];
      const allTemplates = [...presetTemplates, ...customTemplates];
      
      if (allTemplates.length === 0) {
        promptAddMeal(mealType);
        return;
      }

      const mealNames = {
        breakfast: 'Breakfast',
        morningSnack: 'Morning Snack',
        lunch: 'Lunch',
        afternoonSnack: 'Afternoon Snack',
        dinner: 'Dinner'
      };

      let message = `Quick Add - ${mealNames[mealType]}:\n\n`;
      
      // Preset templates
      presetTemplates.forEach((template, idx) => {
        message += `${idx + 1}. ${template.name} (${template.calories} kcal)\n`;
      });
      
      // Custom templates (marked with ★)
      if (customTemplates.length > 0) {
        message += `\n--- Your Custom Templates ---\n`;
        customTemplates.forEach((template, idx) => {
          const num = presetTemplates.length + idx + 1;
          message += `${num}. ★ ${template.name} (${template.calories} kcal)\n`;
        });
      }
      
      message += `\n0. Custom meal\n\nEnter number:`;

      const choice = prompt(message);
      if (choice === null) return;

      const choiceNum = parseInt(choice);
      
      if (choiceNum === 0) {
        promptAddMeal(mealType);
      } else if (choiceNum > 0 && choiceNum <= allTemplates.length) {
        const template = allTemplates[choiceNum - 1];
        addMeal(mealType, template.name, template.calories);
      }
    }

    function promptAddMeal(mealType) {
      const mealNames = {
        breakfast: 'Breakfast',
        morningSnack: 'Morning Snack',
        lunch: 'Lunch',
        afternoonSnack: 'Afternoon Snack',
        dinner: 'Dinner'
      };
      
      const name = prompt(`${mealNames[mealType]} - Meal name:`);
      if (!name) return;
      
      const calories = prompt(`Calories (kcal):`);
      if (!calories || isNaN(calories)) return;
      
      addMeal(mealType, name, parseInt(calories));
    }

    function changeNutritionGoal() {
      const newGoal = prompt(`Daily calorie goal (kcal):\n\nRecommended for 15yo gaining weight: 2,500-3,000 kcal`, state.nutritionGoal);
      if (!newGoal || isNaN(newGoal)) return;
      
      const goal = parseInt(newGoal);
      if (goal < 1000 || goal > 5000) {
        alert('Please enter a realistic goal between 1,000 and 5,000 kcal');
        return;
      }
      
      saveNutritionGoal(goal);
      render();
    }

    function manageTemplates() {
      state.view = 'manageTemplates';
      render();
    }

    function addTemplate(mealType, mealName) {
      const name = prompt(`Add ${mealName} Template\n\nMeal name (e.g. "Chicken + rice"):`);
      if (!name || name.trim() === '') return;
      
      const calories = prompt(`Add ${mealName} Template\n\nMeal: ${name}\n\nCalories (kcal):`);
      if (!calories || calories.trim() === '') return;
      
      const caloriesNum = parseInt(calories);
      if (isNaN(caloriesNum) || caloriesNum <= 0) {
        alert('❌ Please enter a valid number!');
        return;
      }
      
      if (!state.customTemplates[mealType]) {
        state.customTemplates[mealType] = [];
      }
      
      state.customTemplates[mealType].push({
        name: name.trim(),
        calories: caloriesNum
      });
      
      localStorage.setItem('customTemplates', JSON.stringify(state.customTemplates));
      render();
    }

    function deleteTemplate(mealType, index) {
      if (!confirm('Delete this template?')) return;
      
      state.customTemplates[mealType].splice(index, 1);
      localStorage.setItem('customTemplates', JSON.stringify(state.customTemplates));
      render();
    }


    function viewNutritionHistory() {
      state.view = 'nutritionHistory';
      render();
    }

    function viewDayDetails(dateStr) {
      state.selectedDate = dateStr;
      state.view = 'dayDetails';
      render();
    }

    // Initialize app
    loadData();
    render();
  </script>
</body>
</html>
